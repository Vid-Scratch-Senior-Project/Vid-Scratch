<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FGSM Poisoning App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #ffffff;
      text-align: center;
      padding: 40px;
    }
    input, button {
      margin: 10px;
    }
    #outputLog {
      background: #1e1e1e;
      padding: 10px;
      width: 80%;
      height: 120px;
      overflow-y: scroll;
      border: 1px solid #333;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h1>🧪 FGSM Image Poisoning</h1>

  <button id="selectImageButton">📂 Select Image</button>
  <span id="selectedFileName">No file selected</span><br>

  <label>Intensity (ε):</label>
  <input type="range" id="epsSlider" min="0.001" max="1" step="0.001" value="0.01">
  <span id="epsValue">0.01</span><br>

  <button id="poisonButton">🔮 Poison Image</button>

  <pre id="outputLog">Output will appear here...</pre>

  <script src="renderer.js"></script>
</body>
</html>

<script>
  document.getElementById("epsSlider").addEventListener("input", (e) => {
    document.getElementById("epsValue").textContent = e.target.value;
  });
</script>
